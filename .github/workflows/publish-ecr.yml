name: Build and publish shipping API

on:
  push:
    branches:
      - main
    paths-ignore:
      - "infrastructure/**"
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

concurrency:
  group: shipping-api-dev-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: shipping-api

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm assumed AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "Published image: $IMAGE_URI"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition shipping-api-dev \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          jq --arg image "$IMAGE_URI" '
            .containerDefinitions |= map(
              if .name == "shipping-api"
              then .image = $image
              else .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt,
                .enableFaultInjection
              )
          ' task-definition.json > new-task-definition.json

      - name: Register new ECS task definition
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"
          echo "Registered task definition: $TASK_DEF_ARN"

      - name: Capture previous ECS task definition
        run: |
          PREVIOUS_TASK_DEF=$(aws ecs describe-services \
            --cluster shipping-api-dev \
            --services shipping-api-dev \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "PREVIOUS_TASK_DEF=$PREVIOUS_TASK_DEF" >> "$GITHUB_ENV"
          echo "Previous task definition: $PREVIOUS_TASK_DEF"

      - name: Deploy new task definition to ECS
        run: |
          aws ecs update-service \
            --cluster shipping-api-dev \
            --service shipping-api-dev \
            --task-definition "$TASK_DEF_ARN"

          echo "Updated ECS service to: $TASK_DEF_ARN"

      - name: Verify ECS service task definition
        run: |
          DEPLOYED_TASK_DEF=$(aws ecs describe-services \
            --cluster shipping-api-dev \
            --services shipping-api-dev \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Expected: $TASK_DEF_ARN"
          echo "Deployed: $DEPLOYED_TASK_DEF"

          if [ "$DEPLOYED_TASK_DEF" != "$TASK_DEF_ARN" ]; then
            echo "ERROR: ECS service is not using the expected task definition"
            exit 1
          fi

          echo "ECS task definition verified successfully"

      - name: Start ECS task for health verification
        run: |
          aws ecs update-service \
            --cluster shipping-api-dev \
            --service shipping-api-dev \
            --desired-count 1

          echo "VERIFICATION_TASK_STARTED=true" >> "$GITHUB_ENV"
          echo "Started one ECS task for deployment verification"

      - name: Wait for healthy ECS deployment
        timeout-minutes: 10
        run: |
          echo "Waiting for ECS service to stabilize..."

          aws ecs wait services-stable \
            --cluster shipping-api-dev \
            --services shipping-api-dev

          echo "Checking the running task..."

          TASK_ARN=$(aws ecs list-tasks \
            --cluster shipping-api-dev \
            --service-name shipping-api-dev \
            --desired-status RUNNING \
            --query 'taskArns[0]' \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "ERROR: No running ECS task found"
            exit 1
          fi

          TASK_STATUS=$(aws ecs describe-tasks \
            --cluster shipping-api-dev \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].lastStatus' \
            --output text)

          TASK_HEALTH=$(aws ecs describe-tasks \
            --cluster shipping-api-dev \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].healthStatus' \
            --output text)

          TASK_DEFINITION=$(aws ecs describe-tasks \
            --cluster shipping-api-dev \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].taskDefinitionArn' \
            --output text)

          echo "Task status: $TASK_STATUS"
          echo "Task health: $TASK_HEALTH"
          echo "Task definition: $TASK_DEFINITION"

          if [ "$TASK_STATUS" != "RUNNING" ] ||
             [ "$TASK_HEALTH" != "HEALTHY" ] ||
             [ "$TASK_DEFINITION" != "$TASK_DEF_ARN" ]; then
            echo "ERROR: ECS deployment health verification failed"
            exit 1
          fi

          echo "ECS deployment is running and healthy"

      - name: Roll back failed ECS deployment
        if: ${{ failure() && env.DEPLOYMENT_UPDATED == 'true' && env.PREVIOUS_TASK_DEF != '' }}
        run: |
          echo "Deployment failed. Restoring: $PREVIOUS_TASK_DEF"

          aws ecs update-service \
            --cluster shipping-api-dev \
            --service shipping-api-dev \
            --task-definition "$PREVIOUS_TASK_DEF" \
            --desired-count 0

          echo "Rollback requested"

      - name: Stop ECS verification tasks
        if: ${{ always() && env.PREVIOUS_TASK_DEF != '' }}
        run: |
          echo "Returning ECS service to zero tasks..."

          aws ecs update-service \
            --cluster shipping-api-dev \
            --service shipping-api-dev \
            --desired-count 0

          aws ecs wait services-stable \
            --cluster shipping-api-dev \
            --services shipping-api-dev

          echo "ECS service cleanup completed"
